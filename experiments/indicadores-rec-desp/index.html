<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicadores de Receitas e Despesas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hero">
        <div class="indicadores">

            <h2>Receitas e Despesas em Destaque</h2>

            <div class="container-cards">

                <div class="card" data-chart-name="impostos">
                    <h3 class="titulo-indicador">Impostos</h3>
                    <div class="container-mini-chart">
                        <svg class="mini-chart"></svg>
                    </div>
                </div>

                <div class="card" data-chart-name="impostos x pessoal">
                    <h3 class="titulo-indicador">Receita de Impostos x Despesas com Pessoal</h3>
                    <div class="container-mini-chart">
                        <svg class="mini-chart"></svg>
                    </div>
                </div>

                <div class="card" data-chart-name="royalties x iptu">
                    <h3 class="titulo-indicador">Receita de Royalties x IPTU</h3>
                    <div class="container-mini-chart">
                        <svg class="mini-chart"></svg>
                    </div>
                </div>

            </div>

        </div>

        <div class="monte-o-seu">

            <h2>Monte a sua comparação</h2>

            <div class="container-cards">

                <div class="card" data-chart-name="impostos">
                    <select name="item1" id="item1" data-bar="bar1">
                        <option value="">Escolha um item</option>
                    </select>
                    <div class="bar bar-item1 bar1"></div>
                    <select name="item2" id="item2" data-bar="bar2">
                        <option value="">Escolha um item</option>
                    </select>
                    <div class="bar bar-item2 bar2"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="script.js"></script>    
</body>
</html>
